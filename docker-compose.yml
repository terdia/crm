version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/prod.db
    volumes:
      - crm-data:/app/prisma
    restart: unless-stopped

volumes:
  crm-data:
